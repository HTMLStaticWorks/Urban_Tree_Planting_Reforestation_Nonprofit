<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supporter Login | Urban Forest</title>
  <meta name="description" content="Sign in to your Urban Forest supporter portal to track planted trees, record volunteer hours, and monitor local restoration milestones.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231d5945'/%3E%3Cpath d='M50 15C31 25 22 40 22 55c0 17 12 28 28 28s28-11 28-28c0-15-9-30-28-40Z' fill='%23c9e66b'/%3E%3Cpath d='M50 43v40M50 57 36 46M50 66l15-13' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-controls" aria-label="Display controls">
      <button class="theme-btn" type="button" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <button class="theme-btn" type="button" onclick="toggleRTL()" aria-label="Toggle RTL">RTL</button>
    </div>

    <div class="auth-box reveal show">
      <a href="index.html" class="auth-logo" title="Back to website home">
        <div class="logo-mark">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 22C13 29 10 38 13 47C15 51 20 54 27 52C24 43 24 32 20 22Z" fill="#a2db34"/>
            <path d="M44 22C51 29 54 38 51 47C49 51 44 54 37 52C40 43 40 32 44 22Z" fill="#7ebc27"/>
            <path d="M32 7C22 18 17 31 19 41C21 48 26 53 32 55C38 53 43 48 45 41C47 31 42 18 32 7Z" fill="#c9e66b"/>
            <path d="M32 16V50M32 28L24 20M32 36L22 27M32 31L40 23M32 39L42 30" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="32" cy="11" r="2" fill="#ffffff"/>
          </svg>
        </div>
        <div class="logo-text">
          <strong>Urban Forest</strong>
          <span>Tree Planting & Reforestation</span>
        </div>
      </a>

      <h1>Welcome Back</h1>
      <p class="auth-sub">Sign in to your supporter portal.</p>

      <form class="auth-form" onsubmit="loginSubmit(event)">
        <div class="field">
          <label>Email Address</label>
          <input id="loginEmail" required type="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label>Password</label>
          <input required type="password" minlength="6" placeholder="Enter password">
        </div>

        <div class="password-options">
          <label class="remember">
            <input type="checkbox"> Remember Me
          </label>
          <button type="button" class="forgot" onclick="forgotPassword()">
            Forgot Password?
          </button>
        </div>

        <button class="btn btn-green">Login</button>
      </form>

      <div class="social-divider">or continue with</div>

      <div class="socials-auth">
        <button type="button" class="social-auth" onclick="socialLogin('Google')">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.91h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.4z"/>
            <path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.43l-3.24-2.54c-.9.6-2.05.96-3.38.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.62A10 10 0 0 0 12 22z"/>
            <path fill="#FBBC05" d="M6.39 13.86A6 6 0 0 1 6.08 12c0-.65.11-1.28.31-1.86V7.52H3.04A10 10 0 0 0 2 12c0 1.61.39 3.14 1.04 4.48l3.35-2.62z"/>
            <path fill="#EA4335" d="M12 6.01c1.47 0 2.79.5 3.82 1.5l2.87-2.87C16.96 3.01 14.7 2 12 2a10 10 0 0 0-8.96 5.52l3.35 2.62C7.18 7.77 9.39 6.01 12 6.01z"/>
          </svg>
          Google
        </button>
        <button type="button" class="social-auth" onclick="socialLogin('Apple')">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.79 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.1ZM12.03 7.25C11.88 5.02 13.69 3.18 15.77 3c.29 2.58-2.34 4.5-3.74 4.25Z"/>
          </svg>
          Apple
        </button>
      </div>

      <div class="auth-switch">
        Don't have an account?
        <a href="signup.html">Create Account</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
